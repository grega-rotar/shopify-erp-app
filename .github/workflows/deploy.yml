# Builds the image on every push to main, pushes it to Docker Hub tagged with
# the commit SHA and `latest`, then rolls the production stack onto that exact
# SHA over SSH. The VM only pulls; see docs/development.md "Production Compose".
name: deploy
on:
  push:
    branches: [main]

concurrency: deploy-prod

env:
  IMAGE: time4action/recharge-hub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          script: |
            set -e
            cd /data/stack/apps/recharge-hub
            export APP_IMAGE=time4action/recharge-hub:${{ github.sha }}
            docker compose pull migrate web worker
            docker compose up -d --remove-orphans
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:3192/healthz >/dev/null && echo "healthy" && exit 0
              sleep 2
            done
            echo "web not healthy"; docker compose logs --tail=50 migrate web
            exit 1
